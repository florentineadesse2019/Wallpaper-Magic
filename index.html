DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Magic</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-family:Arial;
text-align:center;
background:linear-gradient(120deg,#17005c,#0077ff,#ff0080);
background-size:400% 400%;
animation:fond 8s infinite alternate;
}

@keyframes fond{
0%{background-position:0% 50%}
100%{background-position:100% 50%}
}

h1{font-size:50px}
p{font-size:20px}
button{
padding:15px 30px;
border:0;
border-radius:30px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div>
<h1>✨ Wallpaper Magic</h1>
<p>Bienvenue dans notre application de fonds d'écran animés.</p>
<button onclick="alert('Wallpaper sélectionné !')">
Choisir ce fond
</button>
</div>

</body>
</html>
